name: regulated-review

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify repository review baseline
        run: python3 tools/repo_compliance_check.py
      - name: Verify manifest claim controls
        env:
          PYTHONPATH: .
        run: python3 -m unittest tests.test_manifest_controls -v
