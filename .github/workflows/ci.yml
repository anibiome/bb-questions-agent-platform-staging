name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f prod/requirements.txt ]; then
            pip install -r prod/requirements.txt
          fi

      - name: Run test suite
        env:
          PYTHONPYCACHEPREFIX: /tmp/pycache
        run: |
          # Test imports expect package path "questions_agent_platform".
          # Repo slug uses "questions-agent-platform", so provide a stable alias.
          ln -s "$GITHUB_WORKSPACE" /tmp/questions_agent_platform
          PYTHONPATH=/tmp python -m unittest -q
