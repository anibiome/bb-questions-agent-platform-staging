name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, "codex/**"]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run standardized gates in container
        run: |
          docker run --rm \
            -e GITHUB_BASE_REF="${GITHUB_BASE_REF}" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.11-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends git
              python -m pip install --upgrade pip
              pip install -r requirements.lock.txt
              ./tools/ci_contract.sh lint
              ./tools/ci_contract.sh type-check
              ./tools/ci_contract.sh unit
              ./tools/ci_contract.sh integration-smoke
              ./tools/ci_contract.sh generated-guard
              ./tools/ci_contract.sh clean-tree
            '
